[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volsig"
version = "0.1.0"
description = "Realized-vol forecasting on SPY: HAR vs GARCH, EWMA and the VIX"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "arch>=6.3",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
